services:
  - type: worker
    name: brainbot-bot
    env: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: WEB_API_BASE
        value: https://<your-web>.onrender.com
      - key: SERVICE_TOKEN
        sync: false
      - key: SESSION_WEBHOOK_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: brainbot
